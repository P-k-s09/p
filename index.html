<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plagiarism Detector</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Plagiarism Detector</h1>
        <form method="POST">
            <textarea name="text1" placeholder="Enter first text..." required></textarea>
            <textarea name="text2" placeholder="Enter second text..." required></textarea>
            <button type="submit">Check Similarity</button>
        </form>
        {% if result is not none %}
        <div class="result">
            <h2>Similarity: {{ result }}%</h2>
        </div>
        {% endif %}
    </div>
</body>
</html>
